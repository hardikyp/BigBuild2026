<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Capture Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 720px; margin-inline: auto; line-height: 1.4; }
      label { display: grid; gap: 4px; font-size: 0.9em; }
      input, select, textarea { font: inherit; padding: 6px; }
      .fc-btn { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid #888; background: #fff; }
      .fc-btn-primary { background: #1f4e79; color: #fff; border-color: #1f4e79; }
      .fc-error, .fc-warning { color: #a40000; }
      [data-severity="severe"] .fc-severity, [data-severity="moderate"] .fc-severity { color: #a40000; font-weight: 600; }
      pre { background: #f4f4f4; padding: 8px; overflow-x: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
